<!doctype html>
<html lang="en" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem(
            'skillflow-dark-theme',
          );
          const isDarkTheme =
            savedTheme === null || savedTheme === 'true';
          document.documentElement.classList.toggle(
            'dark-theme',
            isDarkTheme,
          );
          document.documentElement.style.colorScheme =
            isDarkTheme ? 'dark' : 'light';
        } catch {
          document.documentElement.classList.add(
            'dark-theme',
          );

          document.documentElement.style.colorScheme =
            'dark';
        }
      })();
    </script>
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="/site.webmanifest"
    />
    <!-- Primary Meta Tags -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="SkillFlow helps developers discover, build, and organize practical technical skills."
    />
    <meta
      name="theme-color"
      content="#151515"
    />
    <title>SkillFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
